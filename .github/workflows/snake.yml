name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#c1121f&color_dots=#ebedf0,#f4b6b9,#e5676f,#c1121f,#7a0b13
            dist/snake-dark.svg?palette=github-dark&color_snake=#c1121f&color_dots=#161b22,#4a0a10,#7a0b13,#a50f1b,#e5383b

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
